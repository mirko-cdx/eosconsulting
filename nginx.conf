# eosconsulting.de – nginx hinter Coolify/Traefik (TLS terminiert Traefik)

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Relative Redirects, damit hinter dem TLS-Proxy kein http:// entsteht
    absolute_redirect off;
    server_tokens off;

    # Datensparsam: keine Zugriffsprotokolle (siehe Datenschutzerklärung)
    access_log off;
    error_log /dev/stderr warn;

    # www -> Hauptdomain
    if ($host = "www.eosconsulting.de") {
        return 301 https://eosconsulting.de$request_uri;
    }

    # Sicherheits-Header
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; script-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/css image/svg+xml application/xml text/plain application/ld+json;
    gzip_min_length 512;

    # ---- Alte Jimdo-Adressen dauerhaft umleiten ----
    location ^~ /service/       { return 301 /#leistungen; }
    location ^~ /profil/        { return 301 /#profil; }
    location ^~ /klienten       { return 301 /#profil; }
    location ^~ /kontakt        { return 301 /#kontakt; }
    location ^~ /karriere       { return 301 /; }
    location ^~ /kommunikation  { return 301 /; }
    location ^~ /sitemap/       { return 301 /; }
    location = /about           { return 301 /impressum/; }
    location ^~ /about/         { return 301 /impressum/; }
    location ^~ /j/privacy      { return 301 /datenschutz/; }
    location ^~ /j/             { return 301 /; }

    # Statische Assets lange cachen
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; script-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
